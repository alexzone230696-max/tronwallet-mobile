name: Build TronWallet

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 12
        uses: actions/setup-node@v4
        with:
          node-version: 12

      # Fake Realm module
      - name: Prepare fake Realm module
        run: |
          mkdir -p fake_realm
          cat > fake_realm/index.js << 'EOF'
          module.exports = {
            open: () => { console.log("FAKE REALM: open()"); return {}; },
            default: {}
          };
          EOF
          echo '"use strict"; module.exports=require("./index.js");' > fake_realm/main.js

      # IMPORTANT: Fix Yarn registry to avoid 500 errors
      - name: Fix Yarn registry
        run: |
          yarn config set registry https://registry.npmjs.org
          yarn config set strict-ssl false

      - name: Install dependencies
        run: yarn install --network-timeout 1000000

      - name: Replace Realm with fake version
        run: |
          rm -rf node_modules/realm
          cp -r fake_realm node_modules/realm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tronwallet-apk
          path: android/app/build/outputs/apk/release/*.apk